<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="100%" role="img" aria-label="Wahid Bux, Backend Developer: animated banner with an API request pipeline" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3fb950"/>
      <stop offset="1" stop-color="#58a6ff"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#21262d" stroke-width="1"/>
    </pattern>
    <clipPath id="clip"><rect width="900" height="280" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="900" height="280" fill="url(#bg)"/>
    <rect width="900" height="280" fill="url(#grid)"/>

    <!-- title -->
    <text x="450" y="78" text-anchor="middle" font-family="'Segoe UI',Arial,sans-serif" font-size="46" font-weight="700" fill="url(#accent)">Wahid Bux</text>
    <text x="450" y="112" text-anchor="middle" font-family="'Courier New',monospace" font-size="20" fill="#c9d1d9">Backend Developer</text>
    <text x="450" y="138" text-anchor="middle" font-family="'Courier New',monospace" font-size="14" fill="#8b949e">Node.js · Python · FastAPI · Databases</text>

    <!-- pipeline -->
    <g font-family="'Courier New',monospace" font-size="13" text-anchor="middle">
      <line x1="130" y1="205" x2="770" y2="205" stroke="#30363d" stroke-width="2" stroke-dasharray="6 6">
        <animate attributeName="stroke-dashoffset" values="0;-24" dur="1.2s" repeatCount="indefinite"/>
      </line>

      <g>
        <rect x="70" y="185" width="120" height="40" rx="8" fill="#161b22" stroke="#3fb950"/>
        <text x="130" y="210" fill="#3fb950">Request</text>
      </g>
      <g>
        <rect x="230" y="185" width="120" height="40" rx="8" fill="#161b22" stroke="#58a6ff"/>
        <text x="290" y="210" fill="#58a6ff">Route</text>
      </g>
      <g>
        <rect x="390" y="185" width="120" height="40" rx="8" fill="#161b22" stroke="#d2a8ff"/>
        <text x="450" y="210" fill="#d2a8ff">Auth</text>
      </g>
      <g>
        <rect x="550" y="185" width="120" height="40" rx="8" fill="#161b22" stroke="#ffa657"/>
        <text x="610" y="210" fill="#ffa657">Database</text>
      </g>
      <g>
        <rect x="710" y="185" width="120" height="40" rx="8" fill="#161b22" stroke="#3fb950"/>
        <text x="770" y="210" fill="#3fb950">200 OK ✔</text>
      </g>
    </g>

    <!-- travelling packet -->
    <circle r="7" cy="205" fill="#3fb950">
      <animate attributeName="cx" values="130;290;450;610;770;130" keyTimes="0;0.2;0.4;0.6;0.8;1" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="fill" values="#3fb950;#58a6ff;#d2a8ff;#ffa657;#3fb950;#3fb950" keyTimes="0;0.2;0.4;0.6;0.8;1" dur="6s" repeatCount="indefinite"/>
    </circle>

    <text x="450" y="260" text-anchor="middle" font-family="'Courier New',monospace" font-size="12" fill="#6e7681">Nawabshah, Sindh, Pakistan</text>
  </g>
  <rect x="0.5" y="0.5" width="899" height="279" rx="14" fill="none" stroke="#30363d"/>
</svg>
